name: Build Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/"

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Deploy to gh-pages
        run: |
          # 保留 articles 目录
          if [ -d "gh-pages/articles" ]; then
            mv gh-pages/articles /tmp/articles-backup
          fi
          
          # 清理旧的 web 产物（保留 .git）
          find gh-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          
          # 复制新的 web 产物
          cp -r build/web/* gh-pages/
          
          # 恢复 articles 目录
          if [ -d "/tmp/articles-backup" ]; then
            mv /tmp/articles-backup gh-pages/articles
          fi
          
          # 创建 CNAME 文件（自定义域名）
          echo "daweibayu.top" > gh-pages/CNAME
          
          # 查看结果
          ls -la gh-pages/

      - name: Commit and push
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Deploy web build"
          git push
