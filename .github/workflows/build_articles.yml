name: Build Articles

on:
  push:
    branches: [articles]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout articles branch
        uses: actions/checkout@v4
        with:
          ref: articles

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout build script from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch
          sparse-checkout: |
            .github/scripts/build_posts.py
          sparse-checkout-cone-mode: false

      - name: Generate posts.json
        run: |
          python main-branch/.github/scripts/build_posts.py posts posts.json
          cat posts.json

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Sync articles to gh-pages
        run: |
          # 清理旧的 articles 目录
          rm -rf gh-pages/articles
          mkdir -p gh-pages/articles
          
          # 复制文章和资源
          cp -r posts gh-pages/articles/
          cp -r pages gh-pages/articles/
          cp -r assets gh-pages/articles/
          cp posts.json gh-pages/articles/
          
          # 创建 .nojekyll 文件（禁用 Jekyll，允许直接访问 .md 文件）
          touch gh-pages/.nojekyll
          
          # 查看结果
          ls -la gh-pages/articles/

      - name: Commit and push
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update articles content"
          git push
